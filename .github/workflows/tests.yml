name: API Tests

# Runs the API tests on every PR and on every push to main. Separate from deploy.yml, so a failing
# test shows on the PR before merging; it doesn't stop a deploy on its own (see README.md).
on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

# A newer push to the same branch or PR cancels the older run
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep the MongoDB binary outside node_modules, which npm ci deletes, so the cache below survives
      MONGOMS_DOWNLOAD_DIR: ${{ github.workspace }}/.mongodb-binaries

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: api/package-lock.json

      # mongodb-memory-server downloads a MongoDB binary (about 100 MB) on first use; keep it between runs
      - name: Cache MongoDB Binary
        uses: actions/cache@v4
        with:
          path: .mongodb-binaries
          key: mongodb-binaries-${{ runner.os }}-${{ hashFiles('api/package-lock.json') }}

      - name: Run API Tests
        working-directory: ./api
        run: |
          npm ci
          npm test
